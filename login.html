<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Harness</title>
<style>
  :root {
    /* 蓝白黑单色体系 —— 克制、沉浸 */
    --black: #000000;
    --bg: #04060b;
    --blue: #3b82f6;
    --blue-bright: #60a5fa;
    --blue-dim: rgba(59, 130, 246, 0.14);
    --white: #ffffff;
    --white-80: rgba(255, 255, 255, 0.8);
    --white-55: rgba(255, 255, 255, 0.55);
    --white-30: rgba(255, 255, 255, 0.3);
    --line: rgba(59, 130, 246, 0.10);
    --border: rgba(59, 130, 246, 0.28);
    --danger: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--white);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* 环境光：单一蓝色、极淡、大面积，营造深邃空间（非装饰性渐变） */
  .ambient {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(59,130,246,0.10), transparent 70%);
  }
  /* 抽象网格（远层） */
  .grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 42%, #000 20%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 42%, #000 20%, transparent 100%);
  }
  /* 同心圆（抽象几何，极淡） */
  .orbit {
    position: fixed; left: 50%; top: 50%; z-index: 0; pointer-events: none;
    border: 1px solid rgba(59,130,246,0.06); border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .o1 { width: 480px; height: 480px; }
  .o2 { width: 760px; height: 760px; }
  .o3 { width: 1080px; height: 1080px; }

  /* 扫描线（近层，极淡蓝） */
  .scanline {
    position: fixed; left: 0; right: 0; height: 1px; z-index: 1; pointer-events: none;
    background: rgba(59,130,246,0.35); opacity: 0.4;
    animation: scan 9s linear infinite;
  }
  @keyframes scan { 0% { top: -2%; } 100% { top: 102%; } }

  #particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* —— 中央布局，大量留白 —— */
  .stage {
    position: relative; z-index: 3; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 40px; padding: 40px;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 18px; animation: rise .9s cubic-bezier(.2,.8,.2,1); }
  .brand .logo {
    font-size: 56px; font-weight: 700; letter-spacing: 22px; text-indent: 22px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    color: var(--white);
  }
  .brand .rule { width: 56px; height: 1px; background: var(--blue); box-shadow: 0 0 8px rgba(59,130,246,0.7); }
  .brand .sub { color: var(--white-55); font-size: 11px; letter-spacing: 5px; text-transform: uppercase; }

  /* —— 黑玻璃卡片 —— */
  .card {
    width: 372px; max-width: 92vw; position: relative;
    background: rgba(8, 12, 20, 0.66);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 34px 32px 28px;
    backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2);
    box-shadow: 0 24px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset;
    animation: rise .9s cubic-bezier(.2,.8,.2,1) .12s both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  /* HUD 四角 */
  .corner { position: absolute; width: 14px; height: 14px; pointer-events: none; }
  .corner::before, .corner::after { content: ''; position: absolute; background: var(--blue); }
  .corner::before { width: 14px; height: 1px; }
  .corner::after { width: 1px; height: 14px; }
  .corner.tl { top: 7px; left: 7px; } .corner.tl::before { top: 0; left: 0; } .corner.tl::after { top: 0; left: 0; }
  .corner.tr { top: 7px; right: 7px; } .corner.tr::before { top: 0; right: 0; } .corner.tr::after { top: 0; right: 0; }
  .corner.bl { bottom: 7px; left: 7px; } .corner.bl::before { bottom: 0; left: 0; } .corner.bl::after { bottom: 0; left: 0; }
  .corner.br { bottom: 7px; right: 7px; } .corner.br::before { bottom: 0; right: 0; } .corner.br::after { bottom: 0; right: 0; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 10.5px; color: var(--white-55); margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; }
  .field input, .field select {
    width: 100%; height: 44px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(59, 130, 246, 0.18);
    border-radius: 8px; color: var(--white); font-size: 14px; padding: 0 14px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .field input::placeholder { color: var(--white-30); }
  .field input:hover, .field select:hover { border-color: rgba(59,130,246,0.4); }
  .field input:focus, .field select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15), 0 0 22px rgba(59,130,246,0.2);
  }
  .field select { appearance: none; cursor: pointer; }
  .field select option { background: #0a0f1a; color: var(--white); }

  /* 按钮：蓝色描边 → hover 填充（克制、科技） */
  .btn {
    width: 100%; height: 46px; margin-top: 6px;
    background: transparent;
    border: 1px solid var(--blue); border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 500; letter-spacing: 4px; color: var(--white);
    transition: background .25s, box-shadow .25s, transform .12s;
  }
  .btn:hover { background: var(--blue); box-shadow: 0 0 28px rgba(59,130,246,0.45); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .status { margin-top: 16px; font-size: 12.5px; text-align: center; min-height: 18px; color: var(--white-55); }
  .status.err { color: var(--danger); }
  .status.busy { color: var(--blue-bright); }

  .hint { margin-top: 16px; font-size: 11px; color: var(--white-40); line-height: 1.7; text-align: center; }
  .hint a { color: var(--blue-bright); text-decoration: none; }

  .spinner {
    display: inline-block; width: 13px; height: 13px; margin-right: 6px;
    border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 加载遮罩 */
  #loading {
    position: fixed; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    background: var(--bg);
  }
  #loading.show { display: flex; }
  .ring {
    width: 72px; height: 72px; border-radius: 50%; position: relative;
    border: 1px solid rgba(59,130,246,0.25);
    border-top-color: var(--blue);
    animation: spin 1.1s linear infinite;
    box-shadow: 0 0 36px rgba(59,130,246,0.2);
  }
  #loading .ltxt { color: var(--white-80); font-size: 12px; letter-spacing: 5px; }
  #loading .lsmall { color: var(--white-40); font-size: 11px; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="ambient"></div>
  <div class="grid"></div>
  <div class="orbit o1"></div>
  <div class="orbit o2"></div>
  <div class="orbit o3"></div>
  <div class="scanline"></div>
  <canvas id="particles"></canvas>

  <div class="stage">
    <div class="brand">
      <div class="logo">DSH</div>
      <div class="rule"></div>
      <div class="sub">DeepSeek Harness · Intel</div>
    </div>

    <div class="card">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label>用户名</label>
          <input id="username" type="text" placeholder="标识你的会话身份" autocomplete="username">
        </div>
        <div class="field">
          <label>API Key</label>
          <input id="apiKey" type="password" placeholder="sk-..." autocomplete="new-password">
        </div>
        <div class="field">
          <label>基础模型</label>
          <select id="model">
            <option value="deepseek-v4-pro">deepseek-v4-pro · 深度推理</option>
            <option value="deepseek-v4-flash">deepseek-v4-flash · 快速响应</option>
            <option value="deepseek-flash">deepseek-flash · V4.1 Flash</option>
            <option value="__custom__">自定义 OpenAI 兼容模型…</option>
          </select>
        </div>
        <div id="customFields" style="display:none">
          <div class="field">
            <label>Base URL</label>
            <input id="baseURL" type="text" placeholder="https://api.openai.com/v1">
          </div>
          <div class="field">
            <label>模型 ID</label>
            <input id="modelId" type="text" placeholder="gpt-4o / qwen-plus / ...">
          </div>
        </div>
        <button class="btn" id="loginBtn" type="submit">进入</button>
        <div class="status" id="status"></div>
        <div class="hint">
          API Key 从 <a href="#" id="openPlatform">platform.deepseek.com</a> 获取。<br>
          仅保存在本机，不会上传。
        </div>
      </form>
    </div>
  </div>

  <div id="loading">
    <div class="ring"></div>
    <div class="ltxt">初始化 DEEPSEEK HARNESS</div>
    <div class="lsmall" id="loadSmall">正在加载…</div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const status = $('status');
  const btn = $('loginBtn');
  let hasSavedKey = false;

  function setStatus(msg, cls) { status.className = 'status ' + (cls || ''); status.innerHTML = msg; }

  $('openPlatform').addEventListener('click', (e) => {
    e.preventDefault();
    if (window.dshDesktop && window.dshDesktop.openExternal) window.dshDesktop.openExternal('https://platform.deepseek.com');
  });
  $('model').addEventListener('change', () => {
    $('customFields').style.display = $('model').value === '__custom__' ? 'block' : 'none';
  });

  (async () => {
    try {
      if (window.dshDesktop && window.dshDesktop.getConfig) {
        const cfg = await window.dshDesktop.getConfig();
        if (cfg) {
          if (cfg.username) $('username').value = cfg.username;
          if (cfg.providerType === 'custom') {
            $('model').value = '__custom__';
            $('customFields').style.display = 'block';
            if (cfg.baseURL) $('baseURL').value = cfg.baseURL;
            if (cfg.model) $('modelId').value = cfg.model;
          } else if (cfg.model) { $('model').value = cfg.model; }
          if (cfg.hasKey) {
            hasSavedKey = true;
            $('apiKey').placeholder = '已保存 Key（留空则复用）';
          }
        }
      }
    } catch (e) {}
  })();

  async function doLogin(payload) {
    btn.disabled = true;
    setStatus('<span class="spinner"></span>正在验证…', 'busy');
    try {
      const res = await window.dshDesktop.login(payload);
      if (res && res.ok) {
        $('loading').classList.add('show');
        $('loadSmall').textContent = '正在加载核心插件与模型目录…';
      } else {
        setStatus((res && res.error) || '登录失败', 'err');
        btn.disabled = false;
      }
    } catch (err) {
      setStatus('调用失败：' + (err && err.message || err), 'err');
      btn.disabled = false;
    }
  }

  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const username = $('username').value.trim();
    const apiKey = $('apiKey').value.trim();
    const model = $('model').value;
    const isCustom = model === '__custom__';
    if (!username) { setStatus('请输入用户名', 'err'); return; }
    if (!apiKey && !hasSavedKey) { setStatus('请输入 API Key', 'err'); return; }
    if (isCustom) {
      const baseURL = $('baseURL').value.trim();
      const modelId = $('modelId').value.trim();
      if (!baseURL) { setStatus('请输入 Base URL', 'err'); return; }
      if (!modelId) { setStatus('请输入模型 ID', 'err'); return; }
      doLogin({ providerType: 'custom', username, apiKey, baseURL, modelId });
      return;
    }
    doLogin({ providerType: 'deepseek', username, apiKey, model });
  });

  // 粒子：纯蓝、稀疏、克制
  (function particles() {
    const c = $('particles'), ctx = c.getContext('2d');
    let W, H, pts = [];
    function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
    resize(); addEventListener('resize', resize);
    const N = 45;
    for (let i = 0; i < N; i++) pts.push({ x: Math.random()*innerWidth, y: Math.random()*innerHeight, vx:(Math.random()-.5)*.2, vy:(Math.random()-.5)*.2, r: Math.random()*1.4+.4 });
    (function draw() {
      ctx.clearRect(0,0,W,H);
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x<0||p.x>W) p.vx*=-1; if (p.y<0||p.y>H) p.vy*=-1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = 'rgba(96,165,250,0.35)'; ctx.fill();
      }
      for (let i=0;i<N;i++) for (let j=i+1;j<N;j++) {
        const a=pts[i], b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=dx*dx+dy*dy;
        if (d < 100*100) {
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
          ctx.strokeStyle = `rgba(59,130,246,${0.09*(1-d/(100*100))})`;
          ctx.lineWidth = 0.5; ctx.stroke();
        }
      }
      requestAnimationFrame(draw);
    })();
  })();
</script>
</body>
</html>
